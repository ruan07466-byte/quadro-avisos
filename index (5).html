<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadro de Avisos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#24514C; --board-2:#1C413D; --on-board:#FBF8F1; --on-board-2:rgba(251,248,241,.72);
  --paper:#FBF8F1; --ink:#1E2624; --muted:#5E6B68; --line:#E3DDD0; --focus:#F2B84B;
  --c-prova:#D6453D; --c-trabalho:#E39A2D; --c-evento:#3F7FD1; --c-mudanca:#8E5BC7; --c-geral:#6F8F86;
  --shadow:0 1px 0 rgba(0,0,0,.06), 0 10px 22px -14px rgba(0,0,0,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --board:#142B29; --board-2:#0F2220; --paper:#1D2927; --ink:#EEF1EE; --muted:#9FB0AC; --line:#2F3F3C;
    --c-prova:#E8625A; --c-trabalho:#EBA747; --c-evento:#5E97E0; --c-mudanca:#A77AD8; --c-geral:#8BA9A0;
  }
}
:root[data-theme="dark"]{
  --board:#142B29; --board-2:#0F2220; --paper:#1D2927; --ink:#EEF1EE; --muted:#9FB0AC; --line:#2F3F3C;
  --c-prova:#E8625A; --c-trabalho:#EBA747; --c-evento:#5E97E0; --c-mudanca:#A77AD8; --c-geral:#8BA9A0;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5;
  background:var(--board);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:6px 6px;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 64px}

/* Cabeçalho */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;margin:0;color:var(--on-board);
  font-size:clamp(2.2rem,6vw,3.4rem);line-height:.95;letter-spacing:-.02em}
.sub{color:var(--on-board-2);margin:.5rem 0 0}
.userbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.who{color:var(--on-board-2);font-size:.9rem}
.btn{border:0;border-radius:10px;padding:.65rem 1.05rem;cursor:pointer;font-weight:700;background:var(--focus);color:#1E2624}
.btn.ghost{background:transparent;color:var(--on-board);border:1.5px solid rgba(251,248,241,.35)}
.btn.small{padding:.45rem .8rem;font-size:.9rem}
.btn:disabled{opacity:.6;cursor:default}

/* Painéis de admin */
.panel{background:var(--board-2);color:var(--on-board);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.panel h2{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;margin:0 0 8px}
.panel p{margin:.2rem 0 .6rem;color:var(--on-board-2);font-size:.95rem}
.uid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.uid code{background:rgba(255,255,255,.1);padding:.35rem .6rem;border-radius:6px;word-break:break-all;font-size:.85rem}
.admin-list{list-style:none;padding:0;margin:0 0 10px}
.admin-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.admin-list button{background:none;border:0;color:var(--on-board-2);cursor:pointer;text-decoration:underline}
.admin-form{display:flex;gap:8px;flex-wrap:wrap}
.admin-form input{flex:1 1 180px;border:0;border-radius:8px;padding:.5rem .7rem;background:rgba(255,255,255,.1);color:var(--on-board)}
.admin-form input::placeholder{color:rgba(251,248,241,.55)}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{border:1.5px solid rgba(251,248,241,.28);background:transparent;color:var(--on-board);border-radius:999px;
  padding:.35rem .85rem;cursor:pointer;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .n{opacity:.7}
.chip[aria-pressed="true"]{background:var(--on-board);color:#1E2624;border-color:var(--on-board)}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:26px}
.search{flex:1 1 240px;border-radius:999px;border:0;padding:.55rem 1rem;background:rgba(255,255,255,.1);color:var(--on-board)}
.search::placeholder{color:rgba(251,248,241,.55)}
.toggle{color:var(--on-board-2);font-size:.92rem;display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* Seções por prazo */
.group{margin-bottom:30px}
.group-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;color:var(--on-board)}
.group-head h2{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem;margin:0;font-weight:700}
.group-head .count{color:var(--on-board-2);font-size:.92rem}
.group-head::after{content:"";flex:1;height:1px;background:rgba(251,248,241,.14);align-self:center}
.group.hoje .group-head h2{color:var(--focus)}
details.group > summary{list-style:none;cursor:pointer}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary h2::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.group[open] > summary h2::before{transform:rotate(90deg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-items:start}

/* Cartão */
.card{display:grid;grid-template-columns:64px 1fr;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;
  border-top:4px solid var(--c)}
.card.read{opacity:.55}
.date{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px 4px;text-align:center;
  background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.date .d{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.75rem;line-height:1}
.date .m{font-weight:700;font-size:.78rem;letter-spacing:.06em;margin-top:2px}
.date .w{font-size:.78rem;color:var(--muted);margin-top:2px}
.date .none{font-size:1.4rem;line-height:1;margin-top:2px}
.body{padding:12px 14px 8px;min-width:0;display:flex;flex-direction:column}
.row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.tag{font-size:.78rem;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.pin{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.when{margin-left:auto;font-size:.8rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--ink);white-space:nowrap}
.when.hoje{background:var(--c-prova);color:#fff}
.when.amanha{background:var(--focus);color:#1E2624}
.when.passou{color:var(--muted)}
.card h3{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;line-height:1.2;margin:0 0 2px;font-weight:700;overflow-wrap:anywhere}
.materia{font-size:.9rem;color:var(--muted)}
.card p{margin:.5rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.autor{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acts{display:flex;gap:2px;flex-shrink:0;margin-left:auto}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;background:none;border:0;border-radius:8px;cursor:pointer;color:var(--muted)}
.ib:hover{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--ink)}
.ib[aria-pressed="true"]{color:var(--c)}
.ib.danger:hover{color:var(--c-prova)}
.ib svg{width:19px;height:19px}
.lido-txt{background:none;border:0;cursor:pointer;color:var(--muted);font-size:.85rem;padding:.4rem .5rem;border-radius:8px;display:inline-flex;gap:5px;align-items:center}
.lido-txt:hover{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--ink)}
.lido-txt svg{width:17px;height:17px}

.empty{color:var(--on-board);text-align:center;padding:50px 20px;border:2px dashed rgba(251,248,241,.25);border-radius:14px}
.empty h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;font-size:1.4rem}
.empty p{margin:.3rem 0 1rem;color:var(--on-board-2)}

/* Modal */
dialog{border:0;border-radius:14px;padding:0;background:var(--paper);color:var(--ink);width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{padding:22px}
dialog h2{font-family:"Bricolage Grotesque",sans-serif;margin:0 0 14px;font-size:1.4rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:8px;padding:.55rem .7rem;background:transparent}
.field select option{background:var(--paper)}
.field textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;margin:4px 0 16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-actions .btn.ghost{color:var(--ink);border-color:var(--line)}
.err{color:var(--c-prova);font-size:.9rem;min-height:1.2em;margin:0 0 6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);
  background:#1E2624;color:#FBF8F1;padding:.6rem 1rem;border-radius:10px;transition:transform .25s,visibility .25s;z-index:10;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}

@media (max-width:520px){
  .row{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .card{grid-template-columns:56px 1fr}
}
@media (prefers-reduced-motion:reduce){ .toast,details.group > summary h2::before{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Quadro de<br>Avisos</h1>
      <p class="sub" id="resumo">Carregando avisos da turma…</p>
    </div>
    <div class="userbar">
      <span class="who" id="who"></span>
      <button class="btn" id="btnNovo" hidden>+ Novo aviso</button>
      <button class="btn ghost small" id="btnGerenciar" hidden>Quem publica</button>
      <button class="btn ghost small" id="btnEntrar" hidden>Entrar para publicar</button>
      <button class="btn ghost small" id="btnSair" hidden>Sair</button>
    </div>
  </header>

  <section class="panel" id="painelPendente" hidden>
    <h2>Sua conta ainda não publica avisos</h2>
    <p>Envie este código para quem administra o quadro. Depois que ele liberar, recarregue a página.</p>
    <div class="uid"><code id="meuUid"></code><button class="btn small" id="btnCopiarUid">Copiar código</button></div>
  </section>

  <section class="panel" id="painelAdmins" hidden>
    <h2>Quem publica avisos</h2>
    <ul class="admin-list" id="listaAdmins"></ul>
    <div class="admin-form">
      <input id="novoAdminUid" placeholder="Código da pessoa" aria-label="Código da pessoa">
      <input id="novoAdminNome" placeholder="Nome (ex.: Maria, representante)" aria-label="Nome">
      <button class="btn small" id="btnAddAdmin">Liberar publicação</button>
    </div>
  </section>

  <div class="filters" role="group" aria-label="Filtrar por tipo" id="chips"></div>
  <div class="tools">
    <input class="search" id="busca" type="search" placeholder="Buscar por título, texto ou matéria" aria-label="Buscar avisos">
    <label class="toggle"><input type="checkbox" id="ocultarLidos"> Ocultar lidos</label>
  </div>

  <main id="board" aria-live="polite"></main>
</div>

<dialog id="modal">
  <form method="dialog" id="form">
    <h2 id="modalTitulo">Novo aviso</h2>
    <div class="field">
      <label for="fTitulo">Título</label>
      <input id="fTitulo" maxlength="90" placeholder="Ex.: Prova de Bioquímica">
    </div>
    <div class="row">
      <div class="field">
        <label for="fCat">Tipo</label>
        <select id="fCat"></select>
      </div>
      <div class="field">
        <label for="fMateria">Matéria</label>
        <input id="fMateria" list="materias" maxlength="60" placeholder="Opcional">
        <datalist id="materias"></datalist>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fData">Data</label>
        <input id="fData" type="date">
      </div>
      <div class="field">
        <label for="fHora">Horário</label>
        <input id="fHora" type="time">
      </div>
    </div>
    <div class="field">
      <label for="fTexto">Detalhes</label>
      <textarea id="fTexto" maxlength="2000" placeholder="Conteúdo da prova, sala, o que levar…"></textarea>
    </div>
    <label class="check"><input type="checkbox" id="fFixar"> Fixar no topo da seção</label>
    <p class="err" id="erro"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn" id="btnSalvar">Publicar aviso</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script type="module">
/* A configuração do Firebase fica no arquivo config.js, ao lado deste.
   Assim você pode trocar este index.html por versões novas sem mexer nela. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc, getDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let firebaseConfig = null;
try{ ({ firebaseConfig } = await import("./config.js")); }catch(e){ firebaseConfig = null; }

const CATS = {
  prova:{nome:"Prova",cor:"var(--c-prova)"},
  trabalho:{nome:"Trabalho",cor:"var(--c-trabalho)"},
  evento:{nome:"Evento",cor:"var(--c-evento)"},
  mudanca:{nome:"Mudança de aula",cor:"var(--c-mudanca)"},
  geral:{nome:"Recado geral",cor:"var(--c-geral)"}
};
const GRUPOS = [
  ["hoje","Hoje"], ["amanha","Amanhã"], ["semana","Nos próximos dias"],
  ["depois","Mais adiante"], ["sem","Sem data"], ["passou","Já passaram"]
];
const MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const SEMANA = ["dom","seg","ter","qua","qui","sex","sáb"];
const LIDOS_KEY = "quadro-avisos-lidos";

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>',
  pinFill:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5" fill="none"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lerLocal(k, pad){ try{ return JSON.parse(localStorage.getItem(k)) ?? pad; }catch(e){ return pad; } }
function gravarLocal(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let avisos = [], carregado = false, erroCarga = false;
let usuario = null, ehAdmin = false;
let filtro = "todos", editandoId = null;
let lidos = new Set(lerLocal(LIDOS_KEY, []));
let pararAdmins = null;
let passadosAbertos = false;

const configurado = !!firebaseConfig && !Object.values(firebaseConfig).some(v => String(v).includes("COLE_AQUI"));
let auth, dbf;
if(configurado){
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  dbf = getFirestore(app);
}

/* ---------- datas ---------- */
function hoje0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseData(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); }
function diasAte(data){ return data ? Math.round((parseData(data) - hoje0()) / 86400000) : null; }
function grupoDe(a){
  const n = diasAte(a.data);
  if(n === null) return "sem";
  if(n < 0) return "passou";
  if(n === 0) return "hoje";
  if(n === 1) return "amanha";
  if(n <= 7) return "semana";
  return "depois";
}
function textoQuando(a){
  const n = diasAte(a.data);
  if(n === null) return a.hora ? a.hora : "";
  const h = a.hora ? ` · ${a.hora}` : "";
  if(n === 0) return "Hoje" + h;
  if(n === 1) return "Amanhã" + h;
  if(n === -1) return "Ontem";
  if(n < 0) return `Há ${-n} dias`;
  return `Em ${n} dias` + h;
}
const ehLido = a => lidos.has(a.id);
const criadoMs = a => a.criado?.toMillis ? a.criado.toMillis() : (a.criado || Date.now());

/* ---------- render ---------- */
function renderChips(){
  const lista = [["todos","Todos",null], ...Object.entries(CATS).map(([k,v]) => [k,v.nome,v.cor])];
  $("chips").innerHTML = lista.map(([k,n,c]) => {
    const qtd = k === "todos" ? avisos.length : avisos.filter(a => a.cat === k).length;
    return `<button class="chip" data-f="${k}" aria-pressed="${filtro===k}" ${c?`style="--c:${c}"`:""}>
      ${c?'<span class="dot"></span>':""}${n} <span class="n">${qtd}</span></button>`;
  }).join("");
}

function vazio(titulo, texto, botao){
  return `<div class="empty">${titulo?`<h3>${titulo}</h3>`:""}<p>${texto}</p>${botao||""}</div>`;
}

function cartao(a){
  const g = grupoDe(a);
  const cor = CATS[a.cat].cor;
  let dataBloco;
  if(a.data){
    const d = parseData(a.data);
    dataBloco = `<div class="date" aria-hidden="true"><span class="d">${d.getDate()}</span><span class="m">${MESES[d.getMonth()]}</span><span class="w">${SEMANA[d.getDay()]}</span></div>`;
  }else{
    dataBloco = `<div class="date" aria-hidden="true"><span class="none">•</span><span class="w">sem data</span></div>`;
  }
  const quando = textoQuando(a);
  const lido = ehLido(a);
  const acoesAdmin = ehAdmin ? `
      <button class="ib" data-act="fixar" data-id="${esc(a.id)}" aria-pressed="${!!a.fixado}" aria-label="${a.fixado?"Desafixar":"Fixar no topo"}" title="${a.fixado?"Desafixar":"Fixar no topo"}">${a.fixado?ICON.pinFill:ICON.pin}</button>
      <button class="ib" data-act="editar" data-id="${esc(a.id)}" aria-label="Editar" title="Editar">${ICON.edit}</button>
      <button class="ib danger" data-act="excluir" data-id="${esc(a.id)}" aria-label="Excluir" title="Excluir">${ICON.trash}</button>` : "";
  const botaoLido = ehAdmin
    ? `<button class="ib" data-act="lido" data-id="${esc(a.id)}" aria-pressed="${lido}" aria-label="${lido?"Marcar como não lido":"Marcar como lido"}" title="${lido?"Marcar como não lido":"Marcar como lido"}">${ICON.check}</button>`
    : `<button class="lido-txt" data-act="lido" data-id="${esc(a.id)}">${ICON.check}${lido?"Lido":"Marcar como lido"}</button>`;

  return `<article class="card ${lido?"read":""}" id="n-${esc(a.id)}" style="--c:${cor}">
    ${dataBloco}
    <div class="body">
      <div class="row1">
        <span class="tag">${esc(CATS[a.cat].nome)}</span>
        ${a.fixado?`<span class="pin">${ICON.pinFill.replace('<svg','<svg width="12" height="12"')} fixado</span>`:""}
        ${quando?`<span class="when ${g==="hoje"?"hoje":g==="amanha"?"amanha":g==="passou"?"passou":""}">${esc(quando)}</span>`:""}
      </div>
      <h3>${esc(a.titulo)}</h3>
      ${a.materia?`<div class="materia">${esc(a.materia)}</div>`:""}
      ${a.texto?`<p>${esc(a.texto)}</p>`:""}
      <div class="foot">
        <span class="autor">${a.autorNome?`Por ${esc(a.autorNome)}`:""}</span>
        <div class="acts">${botaoLido}${acoesAdmin}</div>
      </div>
    </div>
  </article>`;
}

function ordenar(lista, grupo){
  return lista.sort((a,b) => {
    if(!!a.fixado !== !!b.fixado) return a.fixado ? -1 : 1;
    if(ehLido(a) !== ehLido(b)) return ehLido(a) ? 1 : -1;
    const ka = (a.data||"") + (a.hora||"99:99"), kb = (b.data||"") + (b.hora||"99:99");
    if(ka !== kb) return grupo === "passou" ? kb.localeCompare(ka) : ka.localeCompare(kb);
    return criadoMs(b) - criadoMs(a);
  });
}

function renderQuadro(){
  const board = $("board");
  if(!configurado){ board.innerHTML = vazio("Falta configurar o Firebase", "Crie o arquivo config.js com a configuração do seu projeto, ao lado do index.html."); return; }
  if(erroCarga){ board.innerHTML = vazio("Não foi possível carregar os avisos", "Verifique sua conexão e recarregue a página."); return; }
  if(!carregado){ board.innerHTML = vazio("", "Carregando avisos da turma…"); return; }

  if(!avisos.length){
    board.innerHTML = vazio("Nenhum aviso publicado ainda",
      ehAdmin ? "Publique a próxima prova, uma entrega ou um recado para a turma." : "Quando alguém publicar um aviso, ele aparece aqui na hora.",
      ehAdmin ? '<button class="btn" data-novo>+ Novo aviso</button>' : "");
    return;
  }

  const q = $("busca").value.trim().toLowerCase();
  const ocultar = $("ocultarLidos").checked;
  const lista = avisos.filter(a =>
    (filtro === "todos" || a.cat === filtro) &&
    (!ocultar || !ehLido(a)) &&
    (!q || [a.titulo,a.texto,a.materia].join(" ").toLowerCase().includes(q))
  );
  if(!lista.length){ board.innerHTML = vazio("", "Nenhum aviso com esse filtro."); return; }

  const porGrupo = {};
  for(const a of lista){ (porGrupo[grupoDe(a)] ||= []).push(a); }

  board.innerHTML = GRUPOS.filter(([k]) => porGrupo[k]).map(([k, titulo]) => {
    const itens = ordenar(porGrupo[k], k);
    const n = itens.length;
    const head = `<h2>${titulo}</h2><span class="count">${n} ${n===1?"aviso":"avisos"}</span>`;
    const grid = `<div class="grid">${itens.map(cartao).join("")}</div>`;
    if(k === "passou"){
      return `<details class="group" id="grp-passou" ${passadosAbertos?"open":""}><summary class="group-head">${head}</summary>${grid}</details>`;
    }
    return `<section class="group ${k}" aria-label="${titulo}"><div class="group-head">${head}</div>${grid}</section>`;
  }).join("");

  $("grp-passou")?.addEventListener("toggle", e => { passadosAbertos = e.target.open; });
}

function renderResumo(){
  if(!carregado || !configurado) return;
  const futuros = avisos.filter(a => !ehLido(a) && (diasAte(a.data) === null || diasAte(a.data) >= 0));
  const hoje = futuros.filter(a => diasAte(a.data) === 0).length;
  const semana = futuros.filter(a => { const n = diasAte(a.data); return n !== null && n <= 7; }).length;
  if(!avisos.length){ $("resumo").textContent = "Provas, trabalhos e recados da turma num lugar só."; return; }
  const partes = [];
  if(hoje) partes.push(`${hoje} para hoje`);
  if(semana) partes.push(`${semana} nos próximos 7 dias`);
  $("resumo").textContent = partes.length ? partes.join(" · ") : "Nada pendente para esta semana.";
}

function renderMaterias(){
  const ms = [...new Set(avisos.map(a => a.materia).filter(Boolean))].sort();
  $("materias").innerHTML = ms.map(m => `<option value="${esc(m)}">`).join("");
}

function renderUsuario(){
  $("btnEntrar").hidden = !!usuario || !configurado;
  $("btnSair").hidden = !usuario;
  $("who").textContent = usuario ? (usuario.displayName || usuario.email || "") : "";
  $("btnNovo").hidden = !ehAdmin;
  $("btnGerenciar").hidden = !ehAdmin;
  $("painelPendente").hidden = !(usuario && !ehAdmin);
  if(usuario) $("meuUid").textContent = usuario.uid;
  if(!ehAdmin) $("painelAdmins").hidden = true;
}

function render(){ renderChips(); renderQuadro(); renderResumo(); renderMaterias(); renderUsuario(); }

/* ---------- utilidades ---------- */
let toastT;
function toast(msg){
  $("toast").textContent = msg; $("toast").classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("show"), 2600);
}
function msgErro(e){
  if(e?.code === "permission-denied") return "Sua conta não tem permissão para isso.";
  if(e?.code === "unavailable") return "Sem conexão. Tente de novo em instantes.";
  return "Não foi possível salvar. Tente de novo.";
}
async function escrever(fn){
  try{ await fn(); return true; }catch(e){ console.error(e); toast(msgErro(e)); return false; }
}

function abrirModal(aviso){
  editandoId = aviso ? aviso.id : null;
  $("modalTitulo").textContent = aviso ? "Editar aviso" : "Novo aviso";
  $("btnSalvar").textContent = aviso ? "Salvar alterações" : "Publicar aviso";
  $("fTitulo").value = aviso?.titulo || "";
  $("fCat").value = aviso?.cat || (filtro !== "todos" ? filtro : "prova");
  $("fMateria").value = aviso?.materia || "";
  $("fData").value = aviso?.data || "";
  $("fHora").value = aviso?.hora || "";
  $("fTexto").value = aviso?.texto || "";
  $("fFixar").checked = !!aviso?.fixado;
  $("erro").textContent = "";
  $("modal").showModal();
  $("fTitulo").focus();
}

/* ---------- gerenciar quem publica ---------- */
function abrirAdmins(){
  const painel = $("painelAdmins");
  painel.hidden = !painel.hidden;
  if(painel.hidden || pararAdmins) return;
  pararAdmins = onSnapshot(collection(dbf, "admins"), snap => {
    const lista = snap.docs.map(d => ({uid:d.id, ...d.data()}));
    $("listaAdmins").innerHTML = lista.map(a => `<li>
      <span>${esc(a.nome || "Sem nome")}${a.uid===usuario?.uid?" (você)":""}</span>
      ${a.uid===usuario?.uid ? "" : `<button data-rm-admin="${esc(a.uid)}">Remover</button>`}
    </li>`).join("");
  }, () => toast("Não foi possível carregar a lista."));
}

/* ---------- eventos ---------- */
$("fCat").innerHTML = Object.entries(CATS).map(([k,v]) => `<option value="${k}">${v.nome}</option>`).join("");
$("btnNovo").onclick = () => abrirModal();
$("btnCancelar").onclick = () => $("modal").close();
$("btnGerenciar").onclick = abrirAdmins;
$("btnEntrar").onclick = async () => {
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ if(e?.code !== "auth/popup-closed-by-user") toast("Não foi possível entrar. Tente de novo."); }
};
$("btnSair").onclick = () => signOut(auth);
$("btnCopiarUid").onclick = async () => {
  try{ await navigator.clipboard.writeText(usuario.uid); toast("Código copiado"); }
  catch(e){ toast("Selecione o código e copie manualmente."); }
};
$("btnAddAdmin").onclick = async () => {
  const uid = $("novoAdminUid").value.trim();
  const nome = $("novoAdminNome").value.trim();
  if(!uid){ toast("Cole o código da pessoa."); return; }
  if(await escrever(() => setDoc(doc(dbf, "admins", uid), { nome: nome || "Sem nome", adicionadoPor: usuario.uid }))){
    $("novoAdminUid").value = ""; $("novoAdminNome").value = "";
    toast("Publicação liberada");
  }
};

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const titulo = $("fTitulo").value.trim();
  if(!titulo){ $("erro").textContent = "Dê um título ao aviso."; $("fTitulo").focus(); return; }
  const dados = {
    titulo, cat:$("fCat").value, materia:$("fMateria").value.trim(),
    data:$("fData").value, hora:$("fHora").value, texto:$("fTexto").value.trim(), fixado:$("fFixar").checked
  };
  $("btnSalvar").disabled = true;
  let ok;
  if(editandoId){
    const id = editandoId;
    ok = await escrever(() => updateDoc(doc(dbf, "avisos", id), {...dados, editado: serverTimestamp()}));
    if(ok) toast("Alterações salvas");
  }else{
    ok = await escrever(() => addDoc(collection(dbf, "avisos"), {
      ...dados, autor: usuario.uid, autorNome: usuario.displayName || "", criado: serverTimestamp()
    }));
    if(ok) toast("Aviso publicado para a turma");
  }
  $("btnSalvar").disabled = false;
  if(ok) $("modal").close();
});

document.addEventListener("click", async e => {
  const chip = e.target.closest("[data-f]");
  if(chip){ filtro = chip.dataset.f; render(); return; }
  if(e.target.closest("[data-novo]")){ abrirModal(); return; }
  const rm = e.target.closest("[data-rm-admin]");
  if(rm){
    if(confirm("Tirar a permissão de publicar dessa pessoa?"))
      if(await escrever(() => deleteDoc(doc(dbf, "admins", rm.dataset.rmAdmin)))) toast("Permissão removida");
    return;
  }
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const a = avisos.find(x => x.id === b.dataset.id);
  if(!a) return;
  switch(b.dataset.act){
    case "lido":
      lidos.has(a.id) ? lidos.delete(a.id) : lidos.add(a.id);
      gravarLocal(LIDOS_KEY, [...lidos]); render(); break;
    case "fixar":
      if(await escrever(() => updateDoc(doc(dbf, "avisos", a.id), {fixado: !a.fixado})))
        toast(a.fixado ? "Aviso desafixado" : "Aviso fixado");
      break;
    case "editar": abrirModal(a); break;
    case "excluir":
      if(!confirm(`Excluir "${a.titulo}" para toda a turma?`)) return;
      if(await escrever(() => deleteDoc(doc(dbf, "avisos", a.id)))) toast("Aviso excluído");
      break;
  }
});

$("busca").addEventListener("input", renderQuadro);
$("ocultarLidos").addEventListener("change", renderQuadro);

/* ---------- conexão ---------- */
render();
if(configurado){
  onSnapshot(collection(dbf, "avisos"), snap => {
    avisos = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(a => a.titulo && CATS[a.cat]);
    carregado = true; erroCarga = false;
    render();
  }, err => { console.error(err); erroCarga = true; carregado = true; render(); });

  onAuthStateChanged(auth, async u => {
    usuario = u; ehAdmin = false;
    if(pararAdmins){ pararAdmins(); pararAdmins = null; }
    if(u){
      try{ ehAdmin = (await getDoc(doc(dbf, "admins", u.uid))).exists(); }catch(e){ ehAdmin = false; }
    }
    render();
  });
  // atualiza "hoje/amanhã" quando o dia vira com a página aberta
  setInterval(() => { if(carregado) render(); }, 10 * 60 * 1000);
}
</script>
</body>
</html>
